<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="InicialCs.css">
    <title>Login - Professor</title>

</head>

<body>
<div class="Borcima">
    <div id="Telaprin">
        <div class="Card">
            <div class="logo"><h1>T<span>CCHAT</span></h1></div>

            <div id="EnCad">
                <button id="Entrar">Entrar</button>
                <button id="Cadastrar" onclick="Cadastrar()">Cadastrar</button>
            </div>

            <form id="loginForm" action="" method="post" novalidate>
                <fieldset id="perfil-login" aria-label="Escolha o perfil de acesso">
                    <legend>Entrar como</legend>
                    <button type="button" class="perfil-opcao selecionado" data-perfil="professor" aria-pressed="true">Professor</button>
                    <button type="button" class="perfil-opcao" data-perfil="coordenador" aria-pressed="false">Coordenador</button>
                </fieldset>

                <div id="Email">
                    <label for="E-mail">E-mail</label>
                    <input type="email" id="E-mail" required
                           placeholder="Professor.Sobrenome@professor.cps.sp.gov.br">
                </div>

                <div id="Senha">
                    <label for="Senhas">Senha</label>
                    <input type="password" id="Senhas" required
                           placeholder="Minimo de 8 digitos">
                </div>

                <div id="Entrar-al">
                    <input type="submit" value="Entrar">
                </div>
            </form>

            <p class="login-aluno-link">É aluno? <a href="Log-aluno.html">Entrar na área do aluno</a></p>
        </div>
    </div>
</div>

<script type="module" src="Log-prof.js"></script>
</body>
</html>
