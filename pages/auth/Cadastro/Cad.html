<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="stylesheet" href="Cad-Est.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="Telaprin">
        <div class="Card">
            <div class="logo"> <h1>T<span>CCHAT</span></h1></div>
            <div id="EnCad"> <button id="Entrar" onclick="Logar()">Entrar</button>
            <button id="Cadastrar">Cadastrar</button></div>

            <form action="" id="formCadastro" novalidate>

            <div id="Nome">
                <label for="Nome-da-pessoa">Nome</label>
                <input id="Nome-da-pessoa" type="text"  placeholder="Seu nome completo" required >
            </div>
            <div id="Campo-Email">
                <label for="Email">E-mail</label>
                <input id="Email" type="email" placeholder="seu@email.com" required>
            </div>
            <div id="Campo-Tipo">
                <label for="TipoConta">Tipo de conta</label>
                <select id="TipoConta" required><option value="aluno">Aluno</option><option value="professor">Professor</option></select>
            </div>
            <div class="Senha">
                <label for="Senha">Senha</label>
                <input id="Senha" type="password"  placeholder="Minimo de 8 digitos" required  >
            </div>

            <div class="Senha">
                <label for="RepitaSenha">Repita a Senha</label>
                <input id="RepitaSenha" type="password"  placeholder="Repita a senha" required  >
            </div>
                <div id="Codigo">
                <label for="Codigo-da-pessoa">Convite(s) de acesso</label>
                <input id="Codigo-da-pessoa" type="text" placeholder="Código fornecido pela coordenação" autocomplete="off" required>
                <small>Professor: informe até 8 convites, separados por vírgula. Aluno: informe 1 convite.</small>
            </div>
            <div id="Entrar-al">
                <input type="submit" value="Entrar" >
            </div>
            </Form>
        </div>
    </div>
</body>
<script type="module" src="Cad-back.js"></script>
</html>
