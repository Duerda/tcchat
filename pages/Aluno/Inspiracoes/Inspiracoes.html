<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="Inspiracoes.css">
    <meta charset="UTF-8">

    <title>Inspirações</title>
    <link rel="stylesheet" href="../../shared/buttons.css">
</head>
<body>
<div id="Geral">

    <!-- LATERAL -->
    <div id="lateral">
        <div id="lateral-superior">
            <div><h2 style="margin-top: 2px;">T<span>CCHAT</span></h2></div>
            <div id="Logo-de-professor">ALUNO</div>
        </div>

        <div class="VGABF">
            <div id="painel">Navegação</div>
            <div><button id="painel-btn" onclick="Painel ()" >Painel</button></div>
                <div><button id="Grupo-btn"onclick="MeuGrupo ()">Meu Grupo</button></div>
                <div><button id="Forum-btn"onclick="Forum ()" >Fórum</button></div>
                <div><button id="Inspiracoes-btn" onclick="Inspiracoes ()">Inspirações</button></div>
        </div>

        <div id="sistema"><button onclick="Configuracoes()" id="configuracao">Configurações</button></div>

        <div class="lateral-inferior">
            <div class="Usuario">
                <div id="foto"><span style="margin: 0px;color: #e4e9f4; "></span></div>
                <div id="NomeUC">
                    <h4 style="margin: 0; color: #e4e9f4; width: 100px;"></h4>
                    <h5 style="height: 20px; margin: 0px; color: hsl(210,82%,58%); font-size: medium; width: 80px;"></h5>
                </div>
                <p id="voltar" onclick="Voltar()">X</p>
            </div>
        </div>
    </div>

    <!-- CONTEÚDO -->
    <div id="conteudo">
        <div id="conteudo-superior">
            <h1>Inspirações</h1>
            <p>TCCs de turmas anteriores</p>
        <div id="linha"></div>
        </div>


        <!-- STATS -->
        <div id="stats-inspi">
            <div class="stat-bloco"><div class="stat-val" id="inspi-total">—</div><div class="stat-lbl">TCCs catalogados</div></div>
            <div class="stat-bloco"><div class="stat-val" id="inspi-years">—</div><div class="stat-lbl">Turmas anteriores</div></div>
        </div>

        <!-- BUSCA -->
        <div id="busca-wrap">
            <input type="text" id="busca-inp" placeholder="Buscar tema, tecnologia..." oninput="filtrarInspi()">
        </div>

        <!-- FILTROS -->
    <!-- FILTROS -->
        <div id="filtros">
            <button class="filtro ativo" onclick="irPara('todos')">Todos</button>
            <button class="filtro" onclick="irPara('web')">Web</button>
            <button class="filtro" onclick="irPara('embarcados')">Embarcados</button>
            <button class="filtro" onclick="irPara('software')">Software</button>
            <button class="filtro" onclick="irPara('mobile')">Mobile</button>
        </div>

        <!-- Os cartões são montados com os projetos carregados do Firestore. -->
        <div id="inspi-grid" aria-live="polite"></div>
</div><!-- /conteudo -->
</div>
<script type="module" src="../navegacao.js"></script>
<script type="module" src="Inspiracoes.js"></script>
<script type="module" src="/backend/firebase/seed-inpiracoes.js"></script>

</body>
</html>
