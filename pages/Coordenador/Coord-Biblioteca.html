<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="Coord-style.css">
    <link rel="stylesheet" href="Coord-Biblioteca.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordenador - Biblioteca</title>
    <link rel="stylesheet" href="../shared/buttons.css">
</head>
<body>
<div id="Geral">

    <!-- LATERAL -->
    <div id="lateral">
        <div id="lateral-superior">
            <div><h2 style="margin-top: 2px;">T<span>CCHAT</span></h2></div>
            <div id="Logo-de-professor">COORD</div>
        </div>

        <div class="VGABF">
            <div id="painel">Navegação</div>
            <div><button onclick="Painel()">Painel</button></div>
            <div><button onclick="Usuarios()">Usuários</button></div>
            <div><button onclick="GruposCoord()">Grupos</button></div>
            <div><button onclick="Biblioteca()" id="Biblioteca">Biblioteca</button></div>
            <div><button onclick="Forum()">Fórum</button></div>
        </div>

        <div id="sistema"><button onclick="Configuracoes()" id="configuracao">Configurações</button></div>

        <div class="lateral-inferior">
            <div class="Usuario">
                <div id="foto"><span></span></div>
                <div id="NomeUC">
                    <h4 style="margin: 0; color: #e4e9f4; width: 100px;"></h4>
                    <h5 style="height: 20px; margin: 0px; color: hsl(210,82%,58%); font-size: medium; width: 80px;"></h5>
                </div>
                <p id="voltar" style="margin-top: 31px; margin-bottom: 0px; margin-left: 30px;" onclick="Voltar()">X</p>
            </div>
        </div>
    </div>

    <!-- CONTEÚDO -->
    <div id="conteudo">
        <div id="conteudo-superior">
            <h1>Biblioteca</h1>
            <p>Material de apoio associado à turma selecionada</p>
        </div>

        <div class="biblioteca-toolbar">
            <label for="codigo-sala-biblioteca">Turma do recurso</label>
            <input id="codigo-sala-biblioteca" type="text" maxlength="20" placeholder="Ex.: DS-3">
            <button class="btn-acao" id="Link" type="button">+ Link</button>
            <button class="btn-acao secundario" id="ArquivoModelo" type="button">+ Arquivo/Modelo</button>
        </div>
        <p id="status-biblioteca" class="status-biblioteca" role="status" aria-live="polite"></p>

        <h3 style="color: #e4e9f4;">Links <span style="color: rgb(236, 60, 60);">webs</span></h3>
        <div id="links"></div>

        <h3 style="color: rgb(236, 60, 60); margin-top:50px">Arquivos e Modelos</h3>
        <div id="arquivos"></div>

        <div id="modal-recurso-biblioteca" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-recurso">
            <div class="modal-box">
                <h2 id="titulo-modal-recurso">Adicionar recurso</h2>
                <form id="form-recurso-biblioteca">
                    <fieldset class="seletor-tipo-recurso">
                        <legend>O que deseja compartilhar?</legend>
                        <label><input type="radio" name="tipo-recurso" value="link" checked> Link</label>
                        <label><input type="radio" name="tipo-recurso" value="arquivo"> Arquivo ou modelo</label>
                    </fieldset>
                    <label for="nome-recurso">Nome *</label>
                    <input id="nome-recurso" type="text" maxlength="120" required placeholder="Ex.: Modelo de projeto">
                    <div id="campos-link-recurso">
                        <label for="url-recurso">Endereço do link *</label>
                        <input id="url-recurso" type="url" placeholder="https://exemplo.com" required>
                        <label for="icone-recurso">URL do ícone (opcional)</label>
                        <input id="icone-recurso" type="url" placeholder="https://exemplo.com/icone.png">
                    </div>
                    <div id="campos-arquivo-recurso" hidden>
                        <label for="arquivo-recurso">Arquivo *</label>
                        <input id="arquivo-recurso" type="file" accept=".pdf,.doc,.docx,.odt,.zip,.png,.jpg,.jpeg">
                        <small>PDF, DOC, DOCX, ODT, ZIP, PNG ou JPG · máximo 25 MB</small>
                    </div>
                    <p id="status-recurso-biblioteca" class="status-recurso-biblioteca" role="status" aria-live="polite"></p>
                    <div class="modal-botoes">
                        <button type="button" id="cancelar-recurso-biblioteca">Cancelar</button>
                        <button type="submit" id="salvar-recurso-biblioteca">Adicionar à biblioteca</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script type="module" src="Coord-script.js"></script>
<script type="module" src="Coord-Biblioteca.js"></script>
</body>
</html>
