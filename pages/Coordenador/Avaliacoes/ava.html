<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="ava.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="Geral">
        <!--Incio da sessão lateral-->
        <div id="lateral">
            <div id="lateral-superior">
                <div><h2 style="margin-top: 2px;">T<span>CCHAT</span></h2></div>
                <div id="Logo-de-professor">COORDENAÇÃO</div>
            </div>
            
            <!-- VGABF = Visão Geral, Grupos, Avaliações, Biblioteca e Fórum -->
            <div class="VGABF">

                <div id="painel">Navegação</div>
                <div><button onclick="VisaoGeral ()" >Painel</button></div>
                <div><button onclick="Grupos ()">Grupos</button></div>
                <div><button onclick="Avaliacoes ()" id="Avaliacoes">Avaliações</button></div>
                <div><button onclick="Biblioteca ()">Biblioteca</button></div>
                <div><button onclick="Forum ()">Fórum</button></div>
            </div>
            <div id="sistema"><button onclick="Configuracoes ()" id="configuracao">Configurações</button></div>
            <div class="lateral-inferior">
                <div class="Usuario">
                    <div id="foto"><span style="margin: 0px;color: #e4e9f4; "></span></div>
                    <div id="NomeUC">
                        <h4 style="margin: 0; color: #e4e9f4; width: 100px;"></h4> 
                        <h5 style="height: 20px; margin: 0px; color: hsl(210,82%,58%); font-size: medium; width: 80px;"></h5> 
                    </div>
                    <p id="voltar" style="margin-top: 31px; margin-bottom: 0px; margin-left: 30px;" onclick="Voltar ()">X</p>
                </div>

            </div>
        </div>
        <!--Fim da sessão lateral-->

        <div id="conteudo">
            <div id="conteudo-superior">
                <h1>Avaliações</h1><p>Registrar avaliação de um grupo da turma</p>
            </div>
        
            <div id="EnCad"><button id="Cadastrar" onclick="Cadastrar ()">Histórico</button></div>

            <h1>Avaliar grupo</h1>

        <div class="Cards" id="card-avaliacao">

    <div id="top-card">
        <div>
                <h3 style="margin-top: 0px; margin-bottom: 5px; color: #e4e9f4;">
                Selecione um grupo
            </h3>

            <span style="color: #3d4d61 ;">
                Escolha um grupo da sua turma para registrar uma avaliação.
            </span>
        </div>

        <span class="Estado">
            Coordenação
        </span>
    </div>

    <!-- DIV DO ARQUIVO -->
    <div class="Avaliacoes" id="arquivo-avaliacao">
        <p style="color: #7a8699; margin: 0px;">
            Selecione um grupo para ver os integrantes e o tema.
        </p>

    </div>

    <form>

        <label for="grupo-avaliacao">Grupo</label>
        <select id="grupo-avaliacao" required style="background: #0c1018; color: #e4e9f4; border: 1px solid #3d4d61; border-radius: 7px; padding: 10px; width: 100%;">
            <option value="">Carregando grupos...</option>
        </select>

        <div id="DT-CD">

            <div>
                <p style="font-size: 15px; color: #7a8699; margin-bottom: 4px;">
                    Nota (0-10)
                </p>

                <input
                    type="number"
                    id="nota"
                    min="0"
                    max="10"
                    placeholder="---"
                >
            </div>

            <div>
                <p style="font-size: 15px; color: #7a8699; margin-bottom: 4px;">
                    Feedback
                </p>

                <textarea
                    id="feedback"
                    style="background: #0c1018; color: #e4e9f4; border: 1px solid #3d4d61; border-radius: 7px; padding: 10px; width: 978px; height: 45px;"
                    placeholder="Comentários..."
                ></textarea>
            </div>

        </div>

        <!-- BOTÃO SALVAR -->
        <input
            type="button"
            id="salvar-avaliacao"
            value="Salvar Avaliação"
            class="botao-salvar"
        >

        <!-- BOTÃO VOLTAR -->
        <button
            type="button"
            id="voltar-avaliacao"
            class="botao-voltar"
        >
            Limpar campos
        </button>

    </form>
</div>
<section id="historico-avaliacoes" aria-live="polite"></section>
</body>
<script type="module" src="ava.js"></script>
</html>
