<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="Coord-style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordenador - Painel</title>
    <link rel="stylesheet" href="../shared/buttons.css">
</head>
<body>
<div id="Geral">

    <!-- LATERAL -->
    <div id="lateral">
        <div id="lateral-superior">
            <div><h2 style="margin-top: 2px;">T<span>CCHAT</span></h2></div>
            <div id="Logo-de-professor">COORD</div>
        </div>

        <div class="VGABF">
            <div id="painel">Navegação</div>
            <div><button onclick="Painel()" id="bisao">Painel</button></div>
            <div><button onclick="Usuarios()">Usuários</button></div>
             
            <div><button onclick="GruposCoord()">Grupos</button></div>
             
             
            <div><button onclick="Biblioteca()">Biblioteca</button></div>
            <div><button onclick="Forum()">Fórum</button></div>
             
        </div>

        <div id="sistema">
            <button onclick="Configuracoes()" id="configuracao">Configurações</button>
        </div>

        <div class="lateral-inferior">
            <div class="Usuario">
                <div id="foto"><span style="margin: 0px;"></span></div>
                <div id="NomeUC">
                    <h4 style="margin: 0; color: #e4e9f4; width: 100px;"></h4>
                    <h5 style="height: 20px; margin: 0px; color: hsl(210,82%,58%); font-size: medium; width: 80px;"></h5>
                </div>
                <p id="voltar" style="margin-top: 31px; margin-bottom: 0px; margin-left: 30px;" onclick="Voltar()">X</p>
            </div>
        </div>
    </div>
    <!-- Fim lateral -->

    <!-- CONTEÚDO -->
    <div id="conteudo">
        <div id="conteudo-superior">
            <h1><span>Painel</span> do Coordenador</h1>
            <p>Visão geral de todos os cursos e grupos</p>
        </div>

        <!-- STATS -->
        <div id="Informacoes">
            <div class="Stat">
                <div><h5>CURSOS ATIVOS</h5><h3 style="color:#e4e9f4;">—</h3></div>
            </div>
            <div class="Stat">
                <div><h5>TOTAL DE GRUPOS</h5><h3 style="color:#e4e9f4;">—</h3></div>
            </div>
            <div class="Stat">
                <div><h5>TOTAL DE ALUNOS</h5><h3 style="color:#e4e9f4;">—</h3></div>
            </div>
            <div class="Stat">
                <div><h5>TOTAL DE PROFESSORES</h5><h3 style="color:#e4e9f4;">—</h3></div>
            </div>
            <div class="Stat">
                <div><h5>GRUPOS ATRASADOS</h5><h3 style="color:#f87171;">—</h3></div>
            </div>
            <div class="Stat">
                <div><h5>ENTREGAS PENDENTES</h5><h3 style="color:#fbbf24;">—</h3></div>
            </div>
        </div>

        <!-- ALERTAS -->
        <h1>Alertas do Sistema</h1>
        <!-- CURSOS -->
        <h1 style="margin-top: 22px;">Cursos Ativos</h1>
        <div id="ListaCursos" aria-live="polite"></div>

    </div>
</div>
<script type="module" src="Coord-script.js"></script>
</body>
</html>
