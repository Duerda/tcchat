<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="Coord-style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordenador - Grupos</title>
</head>
<body>
<div id="Geral">
    <div id="lateral">
        <div id="lateral-superior">
            <div style="letter-spacing: 1px;"><h2 style="margin-top: 2px;">T<span>CCHAT</span></h2></div>
            <div id="Logo-de-professor">COORD</div>
        </div>
        <div class="VGABF">
            <div id="painel">Navegação</div>
            <div><button onclick="Painel()">Painel</button></div>
            <div><button onclick="Usuarios()">Usuários</button></div>
             
            <div><button onclick="GruposCoord()" id="ativo">Grupos</button></div>
             
             
            <div><button onclick="Biblioteca()">Biblioteca</button></div>
            <div><button onclick="Forum()">Fórum</button></div>
             
        </div>
        <div id="sistema"><button onclick="Configuracoes()" id="configuracao">Configurações</button></div>
        <div class="lateral-inferior">
            <div class="Usuario">
                <div id="foto"><span></span></div>
                <div id="NomeUC">
                    <h4 style="margin: 0; color: #e4e9f4; width: 100px;"></h4>
                    <h5 style="height: 20px; margin: 0px; color: hsl(210,82%,58%); font-size: medium; width: 80px;"></h5>
                </div>
                <p id="voltar" style="margin-top: 31px; margin-bottom: 0px; margin-left: 30px;" onclick="Voltar()">X</p>
            </div>
        </div>
    </div>

    <div id="conteudo">
        <div id="conteudo-superior">
            <h1>Gestão de <span style="color:#e4e9f4;">Grupos</span></h1>
            <p>Criar grupos, mover alunos e definir orientadores</p>
        </div>

        <div style="display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;">
            <button class="btn-acao" onclick="sortearGrupos()"> Sortear grupos automaticamente</button>
            <button class="btn-acao secundario" onclick="window.location.href='Coord-Criacao.html'">+ Criar grupo manual</button>
        </div>

        <div class="Aviso">
            Configuração: <strong>mín. 3 · máx. 5 alunos</strong> por grupo · máx. <strong>8 grupos</strong> por turma
            <button class="btn-tabela" style="margin-left:12px;" onclick="configurarLimites()">Alterar limites</button>
        </div>

        <div id="abas-turmas" role="tablist" aria-label="Turmas"></div>
        <div id="painel-turmas"></div>

    </div>
</div>
<script type="module" src="Coord-script.js"></script>
</body>
</html>
