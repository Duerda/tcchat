<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="Coord-style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordenador - Usuários</title>
</head>
<body>
<div id="Geral">
    <div id="lateral">
        <div id="lateral-superior">
            <div><h2 style="margin-top: 2px;">T<span>CCHAT</span></h2></div>
            <div id="Logo-de-professor">COORD</div>
        </div>
        <div class="VGABF">
            <div id="painel">Navegação</div>
            <div><button onclick="Painel()">Painel</button></div>
            <div><button onclick="Usuarios()" id="ativo">Usuários</button></div>
            <div><button onclick="GruposCoord()">Grupos</button></div>
            <div><button onclick="Biblioteca()">Biblioteca</button></div>
            <div><button onclick="Forum()">Fórum</button></div>
             
        </div>
        <div id="sistema"><button onclick="Configuracoes()" id="configuracao">Configurações</button></div>
        <div class="lateral-inferior">
            <div class="Usuario">
                <div id="foto"><span></span></div>
                <div id="NomeUC">
                    <h4 style="margin: 0; color: #e4e9f4; width: 100px;"></h4>
                    <h5 style="height: 20px; margin: 0px; color: hsl(210,82%,58%); font-size: medium; width: 80px;"></h5>
                </div>
                <p id="voltar" style="margin-top: 31px; margin-bottom: 0px; margin-left: 30px;" onclick="Voltar()">X</p>
            </div>
        </div>
    </div>

    <div id="conteudo">
        <div id="conteudo-superior">
            <h1>Usuários</h1>
            <p>Gerenciar alunos, professores e códigos de acesso</p>
        </div>

        <!-- ABAS -->
        <div id="EnCad">
            <button class="aba ativa" id="aba-codigos"   onclick="mudarAba('codigos')"> Códigos</button>
            <button class="aba"       id="aba-alunos"    onclick="mudarAba('alunos')"> Alunos</button>
            <button class="aba"       id="aba-professores" onclick="mudarAba('professores')"> Professores</button>
        </div>

        <div id="filtros-usuarios" class="filtros-usuarios" hidden>
            <label>
                Curso
                <select id="filtro-curso">
                    <option value="">Todos os cursos</option>
                </select>
            </label>
            <label>
                Série
                <select id="filtro-serie">
                    <option value="">Todas as séries</option>
                </select>
            </label>
            <button type="button" class="btn-tabela" id="limpar-filtros-usuarios">Limpar filtros</button>
            <span id="resumo-filtros-usuarios" class="resumo-filtros-usuarios" aria-live="polite"></span>
        </div>

        <div id="filtros-codigos" class="filtros-usuarios">
            <label>
                Curso
                <select id="filtro-codigo-curso">
                    <option value="">Todos os cursos</option>
                </select>
            </label>
            <label>
                Série
                <select id="filtro-codigo-serie">
                    <option value="">Todas as séries</option>
                </select>
            </label>
            <button type="button" class="btn-tabela" id="limpar-filtros-codigos">Limpar filtros</button>
            <span id="resumo-filtros-codigos" class="resumo-filtros-usuarios" aria-live="polite"></span>
        </div>

        <!-- CÓDIGOS DE ACESSO -->
        <div class="conteudo-aba" id="tab-codigos">
            <div style="display:flex; gap:10px; margin-bottom:16px;">
                <button class="btn-acao" onclick="gerarCodigo('aluno')">+ Convite Aluno</button>
                <button class="btn-acao secundario" onclick="gerarCodigo('professor')">+ Convite Professor</button>
            </div>
            <table class="Tabela">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Tipo</th>
                        <th>Turmas</th>
                        <th>Usos</th>
                        <th>Validade</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-codigos"></tbody>
            </table>
        </div>

        <!-- ALUNOS -->
        <div class="conteudo-aba" id="tab-alunos" style="display:none;">
            <table class="Tabela">
                <thead>
                    <tr><th>Nome</th><th>Curso</th><th>Grupo</th><th>Último acesso / estado</th><th>Ações</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- PROFESSORES -->
        <div class="conteudo-aba" id="tab-professores" style="display:none;">
            <table class="Tabela">
                <thead>
                    <tr><th>Nome</th><th>Curso</th><th>Grupo</th><th>Último acesso / estado</th><th>Ações</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

    </div>
</div>
<script type="module" src="Coord-script.js"></script>
</body>
</html>
