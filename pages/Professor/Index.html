<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visão Geral - Professor</title>
</head>
<body>
    <div id="Geral">
        <div id="lateral">
            <div id="lateral-superior">
                <div><h2 style="margin-top: 2px;">T<span>CCHAT</span></h2></div>
                <div id="Logo-de-professor">PROFESSOR</div>
            </div>
            
            <div class="VGABF">
                <div id="painel">Navegação</div>
                <div><button onclick="VisaoGeral()" id="bisao">Visão Geral</button></div>
                <div><button onclick="Grupos()">Grupos</button></div>
                <div><button onclick="Avaliacoes()">Avaliações</button></div>
                <div><button onclick="Biblioteca()">Biblioteca</button></div>
                <div><button onclick="Forum()">Fórum</button></div>
            </div>
            
            <div id="sistema"><button onclick="Configuracoes()" id="configuracao">Configurações</button></div>
            
            <div class="lateral-inferior">
                <div class="Usuario">
                    <div id="foto"><span style="margin: 0px;"></span></div>
                    <div id="NomeUC">
                        <h4 style="margin: 0; color: #e4e9f4; width: 100px;"></h4> 
                        <h5 style="height: 20px; margin: 0px; color: hsl(210,82%,58%); font-size: medium; width: 80px;"></h5> 
                    </div>
                    <p id="voltar" onclick="Voltar()">X</p>
                </div>
            </div>
        </div>

        <div id="conteudo">
            <div id="conteudo-superior">
                <h1><span>Visão</span> Geral</h1>
                <p>Seus orientandos e outros</p>
            </div>
            
            <div id="Informacoes">
                <div class="Grupos">
                    <h5>GRUPOS DESTA SALA</h5>
                    <h3 id="gruposOrientados" style="color:#e4e9f4;">—</h3>
                </div>
                <div class="Grupos">
                    <h5>ENTREGAS PENDENTES</h5>
                    <h3 id="entregasPendentes" style="color: #fbbf24;">—</h3>
                </div>
                <div class="Grupos">
                    <h5>DÚVIDA NA CAIXA</h5>
                    <h3 id="duvidasPendentes" style="color: hsl(210,82%,58%);">—</h3>
                </div>
                <div class="Grupos">
                    <h5>GRUPOS EM ATRASO</h5>
                    <h3 id="gruposAtrasados" style="color: #f87171;">—</h3>
                </div>
            </div>
            
            <div id="listaGrupos">
            </div>

            <h1 style="margin-top: 30px;">Grupos da sua turma</h1>
            <div id="gruposResumo" aria-live="polite"></div>

            <h1 style="margin-bottom: 15px; margin-top: 30px;">Bandeja de Dúvidas</h1>
            
            <div id="bandejaDuvidas" aria-live="polite"></div>
            
        </div>
    </div>

<script type="module" src="script.js"></script>
<script>
    const fonteSalva = localStorage.getItem('fontePreferida');
    if (fonteSalva) {
        let styleTag = document.createElement('style');
        styleTag.id = 'dynamic-font-style';
        styleTag.innerHTML = `* { font-family: ${fonteSalva} !important; }`;
        document.head.appendChild(styleTag);
    }

    const tamanhoSalvo = localStorage.getItem('tamanhoPreferido');
    if (tamanhoSalvo && tamanhoSalvo != 16) {
        let fator = tamanhoSalvo / 16;
        setTimeout(() => {
            document.querySelectorAll('*').forEach(el => {
                if (['SCRIPT', 'STYLE', 'SVG', 'PATH'].includes(el.tagName)) return;
                if (!el.dataset.originalFontSize) {
                    el.dataset.originalFontSize = window.getComputedStyle(el).fontSize;
                }
                let tamanhoOriginal = parseFloat(el.dataset.originalFontSize);
                if (tamanhoOriginal > 0) {
                    el.style.fontSize = (tamanhoOriginal * fator) + 'px';
                }
            });
        }, 100);
    }
</script>
</body>
</html>
