<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="grp.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="Geral">
        <!--Incio da sessão lateral-->
        <div id="lateral">
            <div id="lateral-superior">
                <div><h2 style="margin-top: 2px;">T<span>CCHAT</span></h2></div>
                <div id="Logo-de-professor">PROFESSOR</div>
            </div>
            
            <!-- VGABF = Visão Geral, Grupos, Avaliações, Biblioteca e Fórum -->
            <div class="VGABF">

                <div id="painel">Navegação</div>
                <div><button onclick="VisaoGeral ()" id="bisao">Visão Geral</button></div>
                <div><button onclick="Grupos ()" id = "Grupos">Grupos</button></div>
                <div><button onclick="Avaliacoes ()">Avaliações</button></div>
                <div><button onclick="Biblioteca ()">Biblioteca</button></div>
                <div><button onclick="Forum ()">Fórum</button></div>
            </div>
            <div id="sistema"><button onclick="Configuracoes ()" id="configuracao">Configurações</button></div>
            <div class="lateral-inferior">
                <div class="Usuario">
                    <div id="foto"><span style="margin: 0px;color: #e4e9f4; "></span></div>
                    <div id="NomeUC">
                        <h4 style="margin: 0; color: #e4e9f4; width: 100px;"></h4> 
                        <h5 style="height: 20px; margin: 0px; color: hsl(210,82%,58%); font-size: medium; width: 80px;"></h5> 
                    </div>
                    <p id="voltar" style="margin-top: 31px; margin-bottom: 0px; margin-left: 30px;" onclick="Voltar ()">X</p>
                </div>

            </div>
        </div>
        <!--Fim da sessão lateral-->
         <div id="conteudo">
            <div id="conteudo-superior">
                <h1>Grupos</h1><p>Todos os grupos dos cursos</p>
            </div>
            <h2 style="color: #7a8699;">Turmas</h2>

            <div style="margin-bottom:20px;">
                <button class="btnGrupo" id="btnCriarGrupo">
                    Criar Grupo
                </button>
            </div>            

            <!--Formulario de Criação de Grupo-->
            <div id="formGrupo" style="display:none; margin-bottom:25px">
                <input
                    id="nomeProjeto"
                    type="text"
                    placeholder="Nome do TCC">

                <br><br>    

                <textarea 
                id="descricaoGrupo"
                placeholder="Descrição do Projeto"></textarea>

                <br><br>

                <select id="cursoGrupo">
                    <option value="">Selecione o curso</option>
                    <option value="DS">Desenvolvimento de Sistemas</option>
                    <option value="DI">Design de Interiores</option>
                    <option value="HOSP">Hospedagem</option>
                    <option value="IPI">Informática para Internet - MTEC</option>
                    <option value="MA">Meio Ambiente</option>
                    <option value="SEC">Secretariado</option>
                    <option value="ADM">Administração</option>
                    <option value="INF">Informática - MTEC</option>
                </select>

                <br><br>

                <input
                    id="numeroTurma"
                    type="number"
                    min="1"
                    max="3"
                    placeholder="Número da turma">

                <br><br>

                <button id="salvarGrupo">Salvar Grupo</button>
                <button id="cancelarGrupo">Cancelar</button>
            </div>


            <div
                class="conteudo-inferior"
                id="listaGrupos">

            </div>
  
            <!-- Conteúdo inferior dos grupos -->
        </div>
        </div>
       
    </div>
</body>
<script type="module" src="grp.js"></script>
</html>
