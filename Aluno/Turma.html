<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="Turma-Style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<div id="Geral">
       <div id="lateral">
            <div id="lateral-superior">
                <div><h2 style="margin-top: 2px;">T<span>CCHAT</span></h2></div>
                <div id="Logo-de-professor">ALUNO</div>
            </div>
            
            <!-- VGABF = Visão Geral, Grupos, Avaliações, Biblioteca e Fórum -->
            <div class="VGABF">
                               <div id="painel">Painel</div>
                <div><button onclick="Turmas ()" id="bisao">Turmas</button></div>
                <div><button onclick="Grupo ()">Meu Grupo</button></div>
                <div><button onclick="Forum ()">Forum</button></div>
                <div><button onclick="Inspiracoes ()">Inspirações</button></div>
            </div>
            <div id="sistema"><button onclick="Configuracoes ()" id="configuracao">Configurações</button></div>
            <div class="lateral-inferior">
                <div class="Usuario">
                    <div id="foto"><span style="margin: 0px;"></span></div>
                    <div>
                        <h4 style="margin: 0; color: #e4e9f4; width: 100px;">...</h4> 
                        <h5 style="height: 20px; margin: 0px; color: hsl(210,82%,58%); font-size: medium; width: 80px;">Carregando...</h5> 
                    </div>
                    <p id="voltar" style="margin-top: 31px; margin-bottom: 0px; margin-left: 30px;"onclick="Voltar()">X</p>
                </div>"

            </div>
        </div>
         <section class="main">
            <div class="T1">
                <h3 class="mago">Turma <span>2026.1</span></h3>
                <p class="p">Acompanhe todos os grupos e o andamento dos TCCs</p>
            </div>

            <div class="blocos-container">
                <div class="bloco">
                    <div class="interior-bloco">
                        <h1>Grupos</h1>
                        <p id="totalGrupos" style="color: white;"></p>
                    </div>
                
                </div>
                <div class="bloco">
                    <div class="interior-bloco">
                        <h1>No Prazo</h1>
                        <p id="grupoNoPrazo" style="color: #34d399;">0</p>
                    </div>
                </div>

                <div class="bloco">
                <div class="interior-bloco">
                    <h1>Atenção</h1>
                    <p id="grupoAtenção" style="color: #fbbf24;">0</p>
                </div>
            
            </div>
                <div class="bloco">
                    <div class="interior-bloco">
                        <h1>Pendentes</h1>
                        <p id="grupoPendentes" style="color: #EC3C3C;">0</p>
                    </div>
                </div>
            </div>
        
            
            <!--Formulario de Criação de Grupo-->
            <div id="formGrupo" style="display:none; margin-bottom:25px">
                <input
                id="nomeProjeto"
                        type="text"
                        placeholder="Nome do TCC">
                        
                    <br><br>    
                    
                    <textarea 
                    id="descricaoGrupo"
                    placeholder="Descrição do Projeto"></textarea>

                    <br><br>

                    <button id="cancelarGrupo">Cancelar</button>
                    <button id="salvarGrupo">Salvar Grupo</button>
                </div>
                
                <!--GRUPOS DA TURMA-->
            <div class="title-gp">
                <h3>Grupos da Turma</h3>
            </div>
            <button class="btnGrupo" id="btnCriarGrupo">
                Criar Meu Grupo
            </button>
            <div>
            <div class="Grupos">
                
            </div>
            </div>            
        </div>
    </section>
    
</div>

</body>
<script type="module" src="Turma.js"></script>
</html>
